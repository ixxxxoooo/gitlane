[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gitlane"
path = "src/main.rs"

[dependencies]
app.workspace = true
gitcore.workspace = true
graph.workspace = true
gpui.workspace = true
log.workspace = true
env_logger.workspace = true

# Dock 图标随主题切换(与 gpui 用同一版本的 objc2,不新增依赖树)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gitcore.workspace = true
tempfile.workspace = true
